name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Kompilera (py_compile)
        run: |
          python -m py_compile ollama_web.py ollama_studio.py catalog.py huggingface.py soup_train.py
          python -m compileall -q studio

      - name: Kör tester med täckning
        run: |
          python -m pip install --quiet coverage
          python -m coverage run -m unittest discover -s tests -v

      - name: Täckningsspärr (får bara höjas, se .agents/rules/tdd.md)
        run: python -m coverage report

      - name: Lint (ruff, rådgivande)
        continue-on-error: true
        run: |
          python -m pip install --quiet ruff
          ruff check . --output-format=concise
