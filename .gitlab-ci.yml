stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

.test_template:
  stage: test
  before_script:
    - python --version
    - pip install pytest
  script:
    - python -m py_compile ollama_web.py ollama_studio.py catalog.py huggingface.py soup_train.py
    - python -m pytest

test:python3.11:
  extends: .test_template
  image: python:3.11-slim

test:python3.12:
  extends: .test_template
  image: python:3.12-slim
